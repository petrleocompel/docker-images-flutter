name: Build and publish image

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version tag to build (e.g. 3.44.7)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.flutter_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: FLUTTER_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/petrleocompel/docker-images-flutter:${{ steps.version.outputs.version }}
            ghcr.io/petrleocompel/docker-images-flutter:latest

      - name: Make package public
        run: gh api -X PATCH /user/packages/container/docker-images-flutter -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}

      - name: Create GitHub Release
        run: |
          if ! gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            gh release create "${{ steps.version.outputs.version }}" \
              --title "Flutter ${{ steps.version.outputs.version }}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
